<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JEE Mains 2026 — 2 April: Interactive quiz with Physics, Chemistry, and Mathematics questions. Practice memory-based papers from both shifts with instant feedback.">
  <title>JEE Mains 2026 — April Papers | Interactive Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- KaTeX for LaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Animated background particles -->
  <canvas id="particles-canvas"></canvas>

  <!-- Landing Screen -->
  <div id="landing-screen" class="screen active">
    <div class="landing-content">
      <div class="badge animate-slide-down">
        <span class="badge-dot"></span>
        NTA • Memory-Based Papers
      </div>
      <h1 class="landing-title animate-slide-up">
        <span class="gradient-text">JEE Mains 2026</span>
        <span class="subtitle-line">2 April — Both Shifts</span>
      </h1>
      <p class="landing-desc animate-fade-in">Practice from both shifts • Physics, Chemistry & Mathematics</p>

      <!-- Paper Selector Tabs -->
      <div class="paper-tabs animate-fade-in" id="paper-tabs">
        <button class="paper-tab active" data-paper="0">
          <span class="paper-tab-shift">Shift 1</span>
          <span class="paper-tab-count" id="paper-tab-count-0">75 Qs</span>
        </button>
        <button class="paper-tab" data-paper="1">
          <span class="paper-tab-shift">Shift 2</span>
          <span class="paper-tab-count" id="paper-tab-count-1">75 Qs</span>
        </button>
      </div>

      <div class="section-cards animate-fade-in" id="section-cards">
        <!-- Populated dynamically -->
      </div>

      <div class="landing-actions animate-slide-up">
        <button id="btn-start-full" class="btn btn-primary btn-lg">
          <span class="btn-icon">🚀</span>
          Start Full Paper
        </button>
        <button id="btn-start-section" class="btn btn-glass btn-lg">
          <span class="btn-icon">📖</span>
          Choose Subject
        </button>
      </div>

      <div id="section-picker" class="section-picker hidden">
        <button class="btn btn-section" data-section="0" style="--accent: #6C63FF">
          ⚛️ Physics Only
        </button>
        <button class="btn btn-section" data-section="1" style="--accent: #00C9A7">
          🧪 Chemistry Only
        </button>
        <button class="btn btn-section" data-section="2" style="--accent: #FF6B6B">
          📐 Mathematics Only
        </button>
      </div>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen">
    <!-- Top Bar -->
    <header class="quiz-header">
      <div class="header-left">
        <button id="btn-home" class="btn btn-icon-only" title="Back to Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <div class="current-section-badge" id="current-section-badge">⚛️ Physics</div>
      </div>
      <div class="header-center">
        <div class="timer" id="timer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="timer-display">03:00:00</span>
        </div>
      </div>
      <div class="header-right">
        <div class="score-pill">
          <span class="score-label">Score</span>
          <span class="score-value" id="score-display">0</span>
        </div>
        <button id="btn-submit" class="btn btn-danger btn-sm">Submit</button>
      </div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="progress-text" id="progress-text">1 / 25</div>
    </div>

    <!-- Question Navigation Ribbon -->
    <div class="question-nav-ribbon" id="question-nav-ribbon"></div>

    <!-- Question Area -->
    <main class="quiz-main">
      <div class="question-container" id="question-container">
        <div class="question-meta">
          <span class="question-number" id="question-number">Q1</span>
          <span class="question-type-badge" id="question-type-badge">MCQ</span>
          <span class="question-topic" id="question-topic">Units & Dimensions</span>
        </div>
        <div class="question-text" id="question-text"></div>
        
        <!-- MCQ Options -->
        <div class="options-container" id="options-container"></div>
        
        <!-- Numerical Input -->
        <div class="numerical-container hidden" id="numerical-container">
          <label for="numerical-input" class="numerical-label">Enter your answer:</label>
          <input type="number" id="numerical-input" class="numerical-input" placeholder="Type numerical value..." step="any">
          <button class="btn btn-primary btn-sm" id="btn-save-numerical">Save Answer</button>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <footer class="quiz-footer">
      <button id="btn-prev" class="btn btn-glass">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Previous
      </button>
      <button id="btn-clear" class="btn btn-outline">Clear Response</button>
      <button id="btn-mark" class="btn btn-outline btn-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Mark for Review
      </button>
      <button id="btn-next" class="btn btn-primary">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </footer>
  </div>

  <!-- Results Screen -->
  <div id="results-screen" class="screen">
    <div class="results-content">
      <div class="results-header">
        <div class="results-badge" id="results-badge">🏆</div>
        <h1 class="results-title">Quiz Complete!</h1>
        <p class="results-subtitle" id="results-subtitle"></p>
      </div>

      <div class="results-score-ring">
        <svg viewBox="0 0 200 200" class="score-ring-svg">
          <circle cx="100" cy="100" r="85" class="score-ring-bg"/>
          <circle cx="100" cy="100" r="85" class="score-ring-fill" id="score-ring-fill"/>
        </svg>
        <div class="score-ring-text">
          <span class="score-ring-value" id="score-ring-value">0</span>
          <span class="score-ring-total" id="score-ring-total">/ 300</span>
        </div>
      </div>

      <div class="results-stats" id="results-stats"></div>

      <div class="results-section-breakdown" id="results-breakdown"></div>

      <div class="results-actions">
        <button id="btn-review" class="btn btn-primary btn-lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Review Answers
        </button>
        <button id="btn-restart" class="btn btn-glass btn-lg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Try Again
        </button>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h2 class="modal-title" id="modal-title">Submit Quiz?</h2>
      <p class="modal-text" id="modal-text"></p>
      <div class="modal-actions">
        <button class="btn btn-glass" id="modal-cancel">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm">Submit</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
